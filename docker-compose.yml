x-careguide-runtime: &careguide-runtime
  DATABASE_URL: postgresql+psycopg://careguide:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/careguide
  REDIS_URL: redis://redis:6379/0
  EXECUTION_MODE: celery
  STORAGE_DIR: /app/data/uploads
  EMBEDDING_CACHE_DIR: /app/data/embedding-models
  TESSERACT_CMD: tesseract
  TESSERACT_DATA_DIR: ""
  GEMINI_API_KEY: ""

x-careguide-volumes: &careguide-volumes
  - uploads:/app/data
  - embedding_models:/app/data/embedding-models

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: careguide
      POSTGRES_USER: careguide
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports: ["127.0.0.1:${CAREGUIDE_POSTGRES_PORT:-5432}:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careguide"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:${CAREGUIDE_REDIS_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
  api:
    build: .
    env_file: .env
    environment: *careguide-runtime
    command: sh -c "alembic upgrade head && uvicorn app.main:app --app-dir services/api --host 0.0.0.0 --port 8000"
    ports: ["127.0.0.1:${CAREGUIDE_API_PORT:-8000}:8000"]
    volumes: *careguide-volumes
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 20
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  worker:
    build: .
    env_file: .env
    environment: *careguide-runtime
    command: celery -A worker.tasks:celery_app worker --concurrency=2 --loglevel=WARNING
    volumes: *careguide-volumes
    mem_limit: 2g
    cpus: 2
    depends_on:
      api: {condition: service_healthy}
volumes:
  pgdata:
  uploads:
  embedding_models:
