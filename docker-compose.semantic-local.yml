name: careguide-semantic-dev
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: careguide_semantic
      POSTGRES_USER: careguide_semantic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/semantic-local.ps1 Initialize first}
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "careguide_semantic", "-d", "careguide_semantic"]
      interval: 3s
      timeout: 3s
      retries: 15
volumes:
  pgdata:
